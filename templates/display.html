<!DOCTYPE html>
<html>
<head>
    <title>Bible Trivia — Stage Display</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Big-screen tweaks for ProPresenter output.
           Sizes use vw/clamp so everything fits on any projector — nothing
           gets pushed below the screen edge. */
        #stage {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3vh 3vw;
            visibility: hidden;
        }
        #question-view {
            display: none;
            flex-direction: column;
            justify-content: center;
            min-height: 88vh;
        }
        #q-type {
            font-size: clamp(20px, 1.8vw, 34px);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-2);
            margin-bottom: 1.2vh;
            text-shadow: 0 3px 18px rgba(0, 0, 0, 0.5);
        }
        #q-type:empty { display: none; }
        #q-difficulty { margin-bottom: 1.4vh; font-size: clamp(15px, 1.3vw, 24px); }
        #question {
            /* exactly 1.2× the answer size at every width (28/2.6/48 × 1.2) */
            font-size: clamp(33.6px, 3.12vw, 57.6px);
            font-weight: 800;
            line-height: 1.18;
            margin-bottom: 2.6vh;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }
        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.6vh 22px;
        }
        .option {
            font-size: clamp(28px, 2.6vw, 48px);
            font-weight: 700;
            padding: 2vh 2.2vw;
            border-radius: 16px;
            align-items: center;
        }
        .option .key {
            width: clamp(40px, 3.2vw, 62px);
            height: clamp(40px, 3.2vw, 62px);
            font-size: clamp(22px, 1.8vw, 34px);
            border-radius: 14px;
            margin-right: 1.1vw;
            flex-shrink: 0;
        }
        #big-timer { font-size: clamp(44px, 4vw, 76px); font-weight: 800; }
        #big-timer.warn { color: var(--red); }
        #reveal-ref {
            display: inline-block;
            margin-top: 2.4vh;
            padding: 1.4vh 2.6vw;
            font-size: clamp(24px, 2.2vw, 42px);
            font-weight: 700;
            color: var(--gold-2);
            background: rgba(245, 185, 66, 0.12);
            border: 1px solid rgba(245, 185, 66, 0.45);
            border-radius: 999px;
        }
        #reveal-ref:empty { display: none; }
        #leader-strip {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            gap: 26px;
            padding: 12px;
            background: rgba(15, 18, 32, 0.92);
            border-top: 1px solid var(--line);
            font-size: 18px;
        }
        #leader-strip b { color: var(--gold-2); }
        #leader-strip .muted { font-size: clamp(12px, 1vw, 15px); }
        #leader-strip { font-size: clamp(14px, 1.2vw, 20px); gap: 2vw; padding: 1.2vh; }
        #status-msg { font-size: clamp(28px, 2.6vw, 48px); font-weight: 800; text-align: center; margin-top: 2.4vh; }
        #next-note { font-size: clamp(16px, 1.4vw, 26px) !important; margin-top: 1.8vh !important; }
        /* Pregame: just a centered status message — the /qr slide handles
           the join code on its own */
        #pregame-view {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
        }
        /* Paused: full-screen message so the room knows the game is held */
        #pause-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 88vh;
            text-align: center;
        }        #pause-view .pause-title { font-size: clamp(48px, 5vw, 96px); font-weight: 800; }
        #pause-view .pause-sub {
            font-size: clamp(24px, 2.2vw, 40px);
            color: var(--gold-2);
            font-weight: 700;
            margin-top: 2vh;
        }
        /* Join intro: QR code shows first (5s) when the display page loads,
           then hands over to the normal pregame message. */
        #qr-intro {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #qr-intro h1 {
            margin: 0 0 2.2vh;
            font-size: clamp(28px, 3vw, 56px);
            font-weight: 800;
        }
        #qr-card {
            display: inline-block;
            background: #fff;
            padding: clamp(10px, 1.6vh, 20px);
            border-radius: 20px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.45);
        }
        #qr-card img { display: block; width: min(44vh, 42vw); height: auto; }
        #qr-url {
            margin-top: 2vh;
            font-size: clamp(18px, 1.9vw, 36px);
            font-weight: 700;
            color: var(--gold-2);
            word-break: break-all;
        }
        #qr-status {
            margin-top: 1.2vh;
            font-size: clamp(24px, 2.4vw, 44px);
            font-weight: 800;
            color: var(--gold-2);
        }
    </style>
</head>
<body>
    <div id="stage">
        <div id="pregame-view">
            <div id="qr-intro">
                <h1>📱 Scan to Play Bible Trivia</h1>
                <div id="qr-card"><div id="qr"></div></div>
                <div id="qr-url">{{ join_url }}</div>
                <div id="qr-status">Coming Soon</div>
            </div>
            <div id="status-msg" style="display: none;">The game is starting soon... 📖</div>
        </div>

        <div id="pause-view">
            <div class="pause-title">⏸️ Game Paused</div>
            <div class="pause-sub">We'll start again shortly…</div>
        </div>

        <div id="question-view" style="display: none;">
            <div class="timer-wrap" style="max-width: 860px;">
                <div class="timer-bar" style="height: 14px;"><div class="timer-fill" id="timer-fill"></div></div>
                <div id="big-timer">15</div>
            </div>
            <div id="q-type"></div>
            <div><span class="pill" id="q-difficulty"></span></div>
            <div id="question">Loading...</div>
            <div class="option-grid" id="options"></div>
            <div id="reveal-ref"></div>
            <div id="next-note" style="font-size: 24px; margin-top: 14px; color: var(--gold-2); font-weight: 700;"></div>
        </div>
    </div>

    <div id="leader-strip" style="display: none; visibility: hidden;">
        <span class="muted">🏆 Today's Top 3:</span>
        <span id="leader-1"></span>
        <span id="leader-2"></span>
        <span id="leader-3"></span>
    </div>

    <script>
        const socket = io({ query: { display: 'stage' } });

        // ProPresenter activation is reported by the slide_shown event below.
        // Do not make a separate HTTP request here: it races the Socket.IO
        // state sync and can make an old question flash before the new one.

        // Slide mode: tell the server every time ProPresenter shows this slide.
        // On each appearance it starts exactly one new question (server debounced).
        function notifySlideShown() { socket.emit('slide_shown'); }
        socket.on('connect', notifySlideShown);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) notifySlideShown();
        });

        // One place decides which view is on screen, so pausing can restore
        // exactly what was showing before the pause (question or pregame).
        let currentView = 'pregame';
        let viewBeforePause = 'pregame';

        // --- QR join intro (slide mode): QR for ~5s, then the question. ---
        let qrTimer = null;          // pending handover from QR intro to question
        let pendingQuestion = null;  // question waiting for the intro to end
        new QRCode(document.getElementById('qr'), {
            text: {{ join_url | tojson }},
            width: 1024,
            height: 1024,
            colorDark: '#0f1220',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
        });

        function showQrIntro(waiting = false) {
            currentView = 'pregame';
            document.getElementById('qr-intro').style.display = 'flex';
            document.getElementById('status-msg').style.display = 'none';
            document.getElementById('qr-status').style.display = waiting ? 'block' : 'none';
            renderView();
        }

        function showStatusMsg() {
            document.getElementById('qr-intro').style.display = 'none';
            document.getElementById('status-msg').style.display = 'block';
        }

        function endQrIntroNow() {
            // The server, not this browser timeout, owns the handover. Render
            // can delay packets, so rendering the pending question here could
            // put it on screen before the authoritative timer starts.
            if (qrTimer) { clearTimeout(qrTimer); qrTimer = null; }
        }

        function renderQuestion(q) {
            showQuestionView();
            document.getElementById('question').innerText = q.question;
            document.getElementById('reveal-ref').innerText = '';
            document.getElementById('q-type').innerText =
                (q.type_label && q.type_label !== 'Mixed') ? q.type_label : '';
            const pill = document.getElementById('q-difficulty');
            pill.className = 'pill ' + q.difficulty;
            pill.innerText = q.difficulty.toUpperCase();

            const grid = document.getElementById('options');
            grid.innerHTML = '';
            q.options.forEach((opt, i) => {
                const el = document.createElement('div');
                el.className = 'option';
                el.dataset.text = opt;
                el.innerHTML = '<span class="key">' + 'ABCD'[i] + '</span>' + opt;
                grid.appendChild(el);
            });
        }

        function renderView() {
            document.getElementById('stage').style.visibility = 'visible';
            document.getElementById('leader-strip').style.visibility = 'visible';
            document.getElementById('pregame-view').style.display = currentView === 'pregame' ? 'flex' : 'none';
            document.getElementById('question-view').style.display = currentView === 'question' ? 'block' : 'none';
            document.getElementById('pause-view').style.display = currentView === 'pause' ? 'flex' : 'none';
            document.getElementById('leader-strip').style.display = currentView === 'question' || currentView === 'pause' ? 'flex' : 'none';
        }

        // Show the QR immediately on page load. Waiting for the first network
        // event made ProPresenter display a blank stage during Render latency.
        showQrIntro(true);

        function showPregame() {
            if (currentView === 'pause') { viewBeforePause = 'pregame'; return; }
            currentView = 'pregame';
            renderView();
        }

        function showQuestionView() {
            if (currentView === 'pause') { viewBeforePause = 'question'; return; }
            currentView = 'question';
            renderView();
        }

        function showPauseView() {
            if (currentView === 'pause') return;
            viewBeforePause = currentView;
            currentView = 'pause';
            renderView();
        }

        function hidePauseView() {
            if (currentView !== 'pause') return;
            currentView = viewBeforePause;
            renderView();
        }

        socket.on('game_status', (status) => {
            if (status.paused) {
                showPauseView();
                return;
            }
            if (!status.active) {
                // While the QR intro is up, don't tear it down — the question
                // that triggered it is about to appear.
                if (qrTimer || pendingQuestion) return;
                showQrIntro(true);
            }
        });

        socket.on('new_question', (q) => {
            if (q.qr_intro) {
                // Slide mode: show the join QR screen, hold the question until
                // the intro ends (the server sends the question again to all
                // screens at that moment, and this display swaps instantly).
                pendingQuestion = q;
                if (qrTimer) clearTimeout(qrTimer);
                showQrIntro(false);
                qrTimer = setTimeout(endQrIntroNow, q.qr_intro * 1000);
                return;
            }
            if (qrTimer) { clearTimeout(qrTimer); qrTimer = null; }
            pendingQuestion = null;
            renderQuestion(q);
            if (q.timer_started_at) {
                // The question event carries the server's timer start. This
                // avoids a visible question with a stale/blank timer while a
                // separate timer_tick packet is still in transit.
                const total = q.timer_total || 15;
                const left = Math.max(0, Math.ceil(total - (Date.now() / 1000 - q.timer_started_at)));
                const num = document.getElementById('big-timer');
                const fill = document.getElementById('timer-fill');
                num.innerText = left > 0 ? left : "TIME'S UP!";
                num.className = left <= 5 && left > 0 ? 'warn' : '';
                fill.style.width = Math.max(0, (left / total) * 100) + '%';
                fill.className = 'timer-fill' + (left <= 10 ? ' warn' : '');
            }
        });

        socket.on('timer_tick', (data) => {
            const total = data.total || 15;
            const num = document.getElementById('big-timer');
            const fill = document.getElementById('timer-fill');
            if (data.paused) {
                showPauseView();
                return;
            }
            hidePauseView();
            num.innerText = data.active ? data.time_left : "TIME'S UP!";
            num.className = data.time_left <= 5 && data.active ? 'warn' : '';
            fill.style.width = Math.max(0, (data.time_left / total) * 100) + '%';
            fill.className = 'timer-fill' + (data.time_left <= 10 ? ' warn' : '');
        });

        // Highlight the correct answer among the four options
        socket.on('reveal_answer', (data) => {
            [...document.getElementById('options').children].forEach(el => {
                if (el.dataset.text === data.answer) el.classList.add('correct');
                else el.classList.add('dim');
            });
            if (data.reference) {
                document.getElementById('reveal-ref').innerText = '📖 ' + data.reference;
            }
            if (data.next_in) setNextNote(data.next_in);
        });

        function setNextNote(secs) {
            document.getElementById('next-note').innerText =
                secs > 0 ? '⏭️ Next question in ' + secs + 's…' : '';
        }

        socket.on('next_question_countdown', (d) => setNextNote(d.seconds));
        socket.on('new_question', () => setNextNote(0));
        socket.on('game_paused', (d) => {
            if (d.paused) {
                showPauseView();
            } else {
                hidePauseView();
            }
        });

        socket.on('update_leaderboard', (board) => {
            for (let i = 0; i < 3; i++) {
                const el = document.getElementById('leader-' + (i + 1));
                if (board[i]) {
                    el.innerHTML = (i + 1) + '. <b>' + board[i].name + '</b> — ' + board[i].score;
                } else {
                    el.innerText = '';
                }
            }
        });

        socket.on('month_crowned', (w) => {
            document.getElementById('status-msg').innerHTML =
                '👑 ' + w.month_label + ' Champion<br><span style="font-size:64px; color: var(--gold-2);">' +
                w.name + '</span><br><span class="muted" style="font-size:26px;">' + w.points + ' points</span>';
            qrTimer = null; pendingQuestion = null;
            showPregame();
            showStatusMsg();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Bible Trivia — Stage Display</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Big-screen tweaks for ProPresenter output.
           Sizes use vw/clamp so everything fits on any projector — nothing
           gets pushed below the screen edge. */
        #stage {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3vh 3vw;
        }
        #question-view {
            display: none;
            flex-direction: column;
            justify-content: center;
            min-height: 88vh;
        }
        #q-difficulty { margin-bottom: 1.4vh; font-size: clamp(14px, 1.1vw, 20px); }
        #question {
            font-size: clamp(40px, 3.6vw, 68px);
            font-weight: 800;
            line-height: 1.18;
            margin-bottom: 2.6vh;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }
        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.6vh 22px;
        }
        .option {
            font-size: clamp(20px, 1.8vw, 34px);
            padding: 1.6vh 2vw;
            border-radius: 16px;
        }
        .option .key {
            width: clamp(30px, 2.4vw, 46px);
            height: clamp(30px, 2.4vw, 46px);
            font-size: clamp(16px, 1.2vw, 22px);
            border-radius: 12px;
            margin-right: 0.9vw;
        }
        #big-timer { font-size: clamp(44px, 4vw, 76px); font-weight: 800; }
        #big-timer.warn { color: var(--red); }
        #reveal-ref {
            display: inline-block;
            margin-top: 2.4vh;
            padding: 1.2vh 2.4vw;
            font-size: clamp(18px, 1.7vw, 32px);
            font-weight: 700;
            color: var(--gold-2);
            background: rgba(245, 185, 66, 0.12);
            border: 1px solid rgba(245, 185, 66, 0.45);
            border-radius: 999px;
        }
        #reveal-ref:empty { display: none; }
        #leader-strip {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            gap: 26px;
            padding: 12px;
            background: rgba(15, 18, 32, 0.92);
            border-top: 1px solid var(--line);
            font-size: 18px;
        }
        #leader-strip b { color: var(--gold-2); }
        #leader-strip .muted { font-size: clamp(11px, 0.9vw, 14px); }
        #leader-strip { font-size: clamp(13px, 1.1vw, 18px); gap: 2vw; padding: 1.2vh; }
        #status-msg { font-size: clamp(28px, 2.6vw, 48px); font-weight: 800; text-align: center; margin-top: 2.4vh; }
        #next-note { font-size: clamp(16px, 1.4vw, 26px) !important; margin-top: 1.8vh !important; }
        /* Join-by-QR (pre-game + corner during play) — sizes bumped for
           readability from the back rows */
        #pregame-view { text-align: center; }
        #join-qr {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8vh;
            margin-top: 4vh;
        }
        #join-qr .qr-card {
            background: #fff;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.45);
        }
        /* QR canvas is rendered at 1024px and scaled with viewport units so it
           fills the projector: on a 1920x1080 screen this is a ~691px square. */
        #join-qr #qr-big img,
        #join-qr #qr-big canvas {
            width: min(64vh, 42vw) !important;
            height: auto !important;
            display: block;
        }
        #join-qr .qr-title { font-size: clamp(34px, 3vw, 56px); font-weight: 800; }
        #join-qr .qr-url { color: var(--muted); font-size: clamp(18px, 1.6vw, 30px); max-width: 60vw; word-break: break-all; }
        #corner-qr {
            position: fixed;
            right: 24px;
            bottom: 92px;
            z-index: 20;
            text-align: center;
            display: none;
        }
        #corner-qr .qr-card {
            display: inline-block;
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        }
        /* Corner QR stays clear of the option grid on a 1920-wide screen */
        #corner-qr #qr-small img,
        #corner-qr #qr-small canvas {
            width: 260px !important;
            height: auto !important;
            display: block;
        }
        #corner-qr .qr-label {
            margin-top: 8px;
            font-size: 24px;
            font-weight: 700;
            color: var(--gold-2);
        }
    </style>
</head>
<body>
    <div id="stage">
        <div id="pregame-view">
        <div id="join-qr">
            <div class="qr-card"><div id="qr-big"></div></div>
            <div class="qr-title">Scan to Play 📱</div>
            <div class="qr-url">{{ join_url }}</div>
        </div>
        <div id="status-msg">The game is starting soon... 📖</div>
    </div>

        <div id="question-view" style="display: none;">
            <div class="timer-wrap" style="max-width: 860px;">
                <div class="timer-bar" style="height: 14px;"><div class="timer-fill" id="timer-fill"></div></div>
                <div id="big-timer">15</div>
            </div>
            <div><span class="pill" id="q-difficulty"></span></div>
            <div id="question">Loading...</div>
            <div class="option-grid" id="options"></div>
            <div id="reveal-ref"></div>
            <div id="next-note" style="font-size: 24px; margin-top: 14px; color: var(--gold-2); font-weight: 700;"></div>
        </div>
    </div>

    <div id="corner-qr">
        <div class="qr-card"><div id="qr-small"></div></div>
        <div class="qr-label">Join 📱</div>
    </div>

    <div id="leader-strip" style="display: none;">
        <span class="muted">🏆 Today's Top 3:</span>
        <span id="leader-1"></span>
        <span id="leader-2"></span>
        <span id="leader-3"></span>
    </div>

    <script>
        const socket = io();

        // Auto-start: when ProPresenter shows this web view, begin the game
        fetch('/propresenter_start');

        // ---- Join-by-QR -------------------------------------------------
        const joinUrl = {{ join_url | tojson }};
        function buildQR(elId, size) {
            new QRCode(document.getElementById(elId), {
                text: joinUrl,
                width: size,
                height: size,
                colorDark: '#0f1220',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        }
        // Render at high resolution; CSS scales to the projector size so it stays crisp
        buildQR('qr-big', 1024);
        buildQR('qr-small', 520);

        // Slide mode: tell the server every time ProPresenter shows this slide.
        // On each appearance it starts exactly one new question (server debounced).
        function notifySlideShown() { socket.emit('slide_shown'); }
        socket.on('connect', notifySlideShown);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) notifySlideShown();
        });

        function showPregame(joinVisible) {
            document.getElementById('question-view').style.display = 'none';
            document.getElementById('pregame-view').style.display = 'block';
            document.getElementById('join-qr').style.display = joinVisible ? 'flex' : 'none';
            document.getElementById('corner-qr').style.display = 'none';
            document.getElementById('leader-strip').style.display = 'none';
        }

        function showQuestionView() {
            document.getElementById('pregame-view').style.display = 'none';
            document.getElementById('question-view').style.display = 'block';
            document.getElementById('corner-qr').style.display = 'block';
            document.getElementById('leader-strip').style.display = 'flex';
 }

        socket.on('game_status', (status) => {
            if (!status.active) {
                document.getElementById('status-msg').innerText =
                    (status.message || 'The game is starting soon...') + ' 📖';
                showPregame(true);
            }
        });

        socket.on('new_question', (q) => {
            showQuestionView();
            document.getElementById('question').innerText = q.question;
            document.getElementById('reveal-ref').innerText = '';
            const pill = document.getElementById('q-difficulty');
            pill.className = 'pill ' + q.difficulty;
            pill.innerText = q.difficulty.toUpperCase();

            const grid = document.getElementById('options');
            grid.innerHTML = '';
            q.options.forEach((opt, i) => {
                const el = document.createElement('div');
                el.className = 'option';
                el.dataset.text = opt;
                el.innerHTML = '<span class="key">' + 'ABCD'[i] + '</span>' + opt;
                grid.appendChild(el);
            });
        });

        socket.on('timer_tick', (data) => {
            const total = data.total || 15;
            const num = document.getElementById('big-timer');
            const fill = document.getElementById('timer-fill');
            if (data.paused) {
                num.innerText = '⏸ PAUSED';
                num.className = '';
                return;
            }
            num.innerText = data.active ? data.time_left : "TIME'S UP!";
            num.className = data.time_left <= 5 && data.active ? 'warn' : '';
            fill.style.width = Math.max(0, (data.time_left / total) * 100) + '%';
            fill.className = 'timer-fill' + (data.time_left <= 10 ? ' warn' : '');
        });

        // Highlight the correct answer among the four options
        socket.on('reveal_answer', (data) => {
            [...document.getElementById('options').children].forEach(el => {
                if (el.dataset.text === data.answer) el.classList.add('correct');
                else el.classList.add('dim');
            });
            if (data.reference) {
                document.getElementById('reveal-ref').innerText = '📖 ' + data.reference;
            }
            if (data.next_in) setNextNote(data.next_in);
        });

        function setNextNote(secs) {
            document.getElementById('next-note').innerText =
                secs > 0 ? '⏭️ Next question in ' + secs + 's…' : '';
        }

        socket.on('next_question_countdown', (d) => setNextNote(d.seconds));
        socket.on('new_question', () => setNextNote(0));
        socket.on('game_paused', (d) => {
            document.getElementById('next-note').innerText =
                d.paused ? '⏸️ Game paused by host' : '';
        });

        socket.on('update_leaderboard', (board) => {
            for (let i = 0; i < 3; i++) {
                const el = document.getElementById('leader-' + (i + 1));
                if (board[i]) {
                    el.innerHTML = (i + 1) + '. <b>' + board[i].name + '</b> — ' + board[i].score;
                } else {
                    el.innerText = '';
                }
            }
        });

        socket.on('month_crowned', (w) => {
            document.getElementById('status-msg').innerHTML =
                '👑 ' + w.month_label + ' Champion<br><span style="font-size:64px; color: var(--gold-2);">' +
                w.name + '</span><br><span class="muted" style="font-size:26px;">' + w.points + ' points</span>';
            showPregame(false);
        });
    </script>
</body>
</html>
